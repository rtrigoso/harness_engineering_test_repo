# Outer loop: scheduled, investigative GC sweeps (see HARNESS.md > Garbage
# Collection). Report-only — never fails the job. workflow_dispatch is
# included so this can be triggered on demand instead of waiting a week.
name: Outer Loop (GC)

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — deterministic GC
    - cron: "0 6 1 * *" # monthly, 1st 06:00 UTC — agent-backed doc audit
  workflow_dispatch: {}

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency freshness
        run: npm outdated || true

      - name: Dead code / unused exports
        run: npx ts-prune || true

      - name: Documentation staleness
        run: ./scripts/check-doc-staleness.sh

  # Agent-backed audit of HARNESS.md against actual repo state. Monthly
  # cadence (heavier than the deterministic GC above) + manual dispatch.
  # Report-only: opens/updates a GitHub issue, never blocks anything.
  harness-doc-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Claude Code — HARNESS.md audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}

            Audit HARNESS.md against the actual state of this repository.
            HARNESS.md declares constraints, garbage-collection rules, and
            enforcement status; your job is to find discrepancies between
            what it claims and what is actually true in the codebase —
            not to review code quality or style.

            Specifically check:
            - Every "Tool" field references a script/command that actually
              exists at that path and does what the Rule/Enforcement
              fields claim.
            - Every "Enforcement" and "Scope" value matches where the
              check actually runs (inner loop hooks in .claude/hooks/,
              middle loop in .github/workflows/pr-checks.yml, outer loop
              in .github/workflows/outer-loop.yml) and whether it actually
              blocks or is advisory.
            - The Status block's enforcement ratio matches the actual
              count of constraints at each level.
            - Any factual/technical claim in the prose (e.g. version
              requirements) is directionally correct.

            Do not comment on wording, style, or anything that isn't a
            factual or logical inconsistency.

            Then: search for an open issue labeled "harness-doc-audit"
            using `gh issue list --label harness-doc-audit --state open`.
            If one exists, update its body with your findings via
            `gh issue edit`. If none exists and you found discrepancies,
            create one via `gh issue create --label harness-doc-audit`
            with your findings. If you found no discrepancies and an open
            issue exists, close it via `gh issue close` noting it's
            resolved. If you found no discrepancies and no issue exists,
            do nothing.

          claude_args: |
            --allowedTools "Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue close:*),Read,Grep,Glob"
